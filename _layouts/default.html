<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2024">
  {% seo %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ site.avatar | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/dbg.css' | relative_url }}">
</head>
<body>
{% include dbg-header.html %}
<main>
{{ content }}
</main>
{% include dbg-footer.html %}
<button class="top-btn" id="top-btn" aria-label="Back to top">↑ TOP</button>
<script src="{{ '/assets/js/dbg.js' | relative_url }}" defer></script>
</body>
</html>
